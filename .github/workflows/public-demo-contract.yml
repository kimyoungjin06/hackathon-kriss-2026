name: Public demo contract

on:
  pull_request:
    paths:
      - "demo/**"
      - "scripts/verify_demo_bundle.py"
      - ".github/workflows/public-demo-contract.yml"
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "scripts/verify_demo_bundle.py"
      - ".github/workflows/public-demo-contract.yml"

permissions:
  contents: read

jobs:
  verify-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out event repository
        uses: actions/checkout@v4

      - name: Verify public files and lineage receipt
        run: python3 scripts/verify_demo_bundle.py

      - name: Check out canonical CiteSage branch
        uses: actions/checkout@v4
        with:
          repository: kimyoungjin06/CiteSage
          ref: kriss-chem
          path: canonical-citesage

      - name: Reject export drift and stale files
        run: >-
          python3 canonical-citesage/scripts/export_event_demo.py
          --destination "$GITHUB_WORKSPACE/demo"
          --check
